<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Results</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="card">

    <h1>Your Path</h1>
    <h2 id="result"></h2>
    <p id="desc"></p>

    <a class="button" href="index.html">Restart</a>

  </div>
</div>

<script>
const result = localStorage.getItem("result");

const desc = {
  CS: "Coding, logic, AI, engineering.",
  BIO: "Medicine, biology, research.",
  ART: "Design, animation, creativity.",
  BUS: "Business, leadership, entrepreneurship."
};

document.getElementById("result").innerText = result || "No result";
document.getElementById("desc").innerText = desc[result] || "";
</script>

</body>
</html>
