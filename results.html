<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Result</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="card">

    <h1>Your Path</h1>

    <h2 id="result"></h2>

    <p id="desc"></p>

    <a class="button" href="index.html">Try Again</a>

  </div>
</div>

<script>
let result = localStorage.getItem("result");

let desc = {
  "CS": "You enjoy logic, coding, and problem solving. Careers: Software Engineering, AI, Cybersecurity.",
  "BIO": "You enjoy biology and life sciences. Careers: Medicine, Biology, Research.",
  "ART": "You enjoy creativity and design. Careers: Design, Architecture, Animation.",
  "BUS": "You enjoy systems, leadership, and organization. Careers: Business, Entrepreneurship, Economics."
};

document.getElementById("result").innerText = result;
document.getElementById("desc").innerText = desc[result];
</script>

</body>
</html>
